const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PAGE_SIZE);

let currentPage = 0;
let answers = {}; // globalIndex -> chosen option number (1-4)

// Per-page state: whether that page has been checked, and its score
const pageState = Array.from({ length: TOTAL_PAGES }, () => ({ submitted: false, score: 0 }));

const els = {
  quizList: document.getElementById('quizList'),
  pageScoreBanner: document.getElementById('pageScoreBanner'),
  overallSummary: document.getElementById('overallSummary'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  pageIndicator: document.getElementById('pageIndicator'),
  progressText: document.getElementById('progressText'),
  checkPageBtn: document.getElementById('checkPageBtn'),
};

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getQuestionTranslation(globalIdx, q) {
  const raw = q.bn || QUESTION_TRANSLATIONS[globalIdx] || '';
  return raw.replace(/\s*উত্তর\s*:\s*.*$/i, '').trim();
}

function pageRange(pageIndex) {
  const start = pageIndex * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, QUESTIONS.length);
  return { start, end };
}

function questionTemplate(q, globalIdx) {
  const optionsHtml = q.options.map((optEn, i) => {
    const optionNumber = i + 1;
    return `
      <button type="button"
        class="opt-btn w-full text-left border border-teal-900/15 rounded-md px-4 py-3 flex items-start gap-3 hover:border-teal-600 transition-colors"
        data-qidx="${globalIdx}" data-option="${optionNumber}" aria-pressed="false">
        <span class="opt-marker mt-0.5 h-5 w-5 flex-none rounded-full border border-teal-900/25 flex items-center justify-center text-[11px] font-semibold text-teal-700">${optionNumber}</span>
        <span class="flex-1">${escapeHtml(optEn)}</span>
      </button>`;
  }).join('');

  const bengaliText = getQuestionTranslation(globalIdx, q) || 'এই প্রশ্নের বাংলা অনুবাদ এখনও যোগ করা হয়নি।';

  return `
    <article class="bg-white border border-teal-900/10 rounded-lg p-5" data-question-card="${globalIdx}">
      <button type="button" class="question-toggle" data-question-trigger="${globalIdx}" aria-expanded="false">
        <div class="flex items-start gap-3">
          <span class="font-serif text-teal-700 font-semibold text-lg flex-none">${globalIdx + 1}.</span>
          <p class="question-text flex-1 font-medium leading-relaxed text-left">${escapeHtml(q.q)}</p>
        </div>
      </button>
      <div class="translation-panel hidden mt-3 ml-8 rounded-md px-4 py-3 text-sm leading-relaxed bn" data-translation="${globalIdx}">
        ${escapeHtml(bengaliText)}
      </div>
      <div class="mt-4 space-y-2 pl-8" data-options="${globalIdx}">
        ${optionsHtml}
      </div>
    </article>`;
}

function renderPage() {
  const { start, end } = pageRange(currentPage);
  const slice = QUESTIONS.slice(start, end);
  const thisPageSubmitted = pageState[currentPage].submitted;

  els.quizList.innerHTML = slice.map((q, i) => questionTemplate(q, start + i)).join('');

  for (let idx = start; idx < end; idx++) {
    applyOptionVisualState(idx, thisPageSubmitted);
  }

  els.pageIndicator.textContent = `Page ${currentPage + 1} of ${TOTAL_PAGES}`;
  els.prevBtn.disabled = currentPage === 0;
  els.nextBtn.disabled = currentPage === TOTAL_PAGES - 1;

  renderPageScoreBanner();
  updateProgress();
  updateCheckButton();
  updateOverallSummary();
}

function applyOptionVisualState(globalIdx, thisPageSubmitted) {
  const q = QUESTIONS[globalIdx];
  const chosen = answers[globalIdx];
  const buttons = document.querySelectorAll(`[data-options="${globalIdx}"] .opt-btn`);

  buttons.forEach(btn => {
    const optionNumber = parseInt(btn.dataset.option, 10);
    const marker = btn.querySelector('.opt-marker');

    btn.disabled = thisPageSubmitted;
    btn.classList.toggle('cursor-default', thisPageSubmitted);

    if (!thisPageSubmitted) {
      const isChosen = optionNumber === chosen;
      btn.setAttribute('aria-pressed', String(isChosen));
      btn.classList.toggle('border-teal-600', isChosen);
      btn.classList.toggle('bg-teal-50', isChosen);
      marker.classList.toggle('bg-teal-700', isChosen);
      marker.classList.toggle('text-white', isChosen);
      marker.classList.toggle('border-teal-700', isChosen);
      return;
    }

    const isCorrect = optionNumber === q.correct;
    const isChosenWrong = optionNumber === chosen && chosen !== q.correct;

    btn.classList.remove('border-teal-900/15', 'border-teal-600', 'bg-teal-50');
    marker.classList.remove('bg-teal-700', 'border-teal-700', 'text-white');

    if (isCorrect) {
      btn.classList.add('border-moss-500', 'bg-moss-50');
      marker.classList.add('bg-moss-500', 'border-moss-500', 'text-white');
    } else if (isChosenWrong) {
      btn.classList.add('border-brick-500', 'bg-brick-50');
      marker.classList.add('bg-brick-500', 'border-brick-500', 'text-white');
    } else {
      btn.classList.add('border-teal-900/15');
    }
  });
}

els.quizList.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-question-trigger]');
  if (trigger) {
    const globalIdx = parseInt(trigger.dataset.questionTrigger, 10);
    const panel = document.querySelector(`[data-translation="${globalIdx}"]`);
    if (!panel) return;
    const isOpen = trigger.getAttribute('aria-expanded') === 'true';
    trigger.setAttribute('aria-expanded', String(!isOpen));
    panel.classList.toggle('hidden', isOpen);
    return;
  }

  if (pageState[currentPage].submitted) return;
  const opt = e.target.closest('.opt-btn');
  if (!opt) return;

  const globalIdx = parseInt(opt.dataset.qidx, 10);
  const chosen = parseInt(opt.dataset.option, 10);
  answers[globalIdx] = chosen;
  applyOptionVisualState(globalIdx, false);
  updateProgress();
  updateCheckButton();
});

function updateProgress() {
  const { start, end } = pageRange(currentPage);
  let answeredOnPage = 0;
  for (let i = start; i < end; i++) if (answers[i] !== undefined) answeredOnPage++;
  els.progressText.textContent = `${answeredOnPage} of ${end - start} answered on this page`;
}

function updateCheckButton() {
  const { start, end } = pageRange(currentPage);
  const answeredOnPage = Object.keys(answers).filter(k => k >= start && k < end).length;

  if (pageState[currentPage].submitted) {
    els.checkPageBtn.textContent = 'Retry this page';
    els.checkPageBtn.disabled = false;
    els.checkPageBtn.classList.remove('bg-amber-600', 'hover:bg-amber-700');
    els.checkPageBtn.classList.add('bg-teal-700', 'hover:bg-teal-800');
  } else {
    els.checkPageBtn.textContent = 'Check this page';
    els.checkPageBtn.disabled = answeredOnPage === 0;
    els.checkPageBtn.classList.remove('bg-teal-700', 'hover:bg-teal-800');
    els.checkPageBtn.classList.add('bg-amber-600', 'hover:bg-amber-700');
  }
}

els.checkPageBtn.addEventListener('click', () => {
  const { start, end } = pageRange(currentPage);

  if (pageState[currentPage].submitted) {
    // Retry this page only
    for (let i = start; i < end; i++) delete answers[i];
    pageState[currentPage] = { submitted: false, score: 0 };
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  let score = 0;
  for (let i = start; i < end; i++) {
    if (answers[i] === QUESTIONS[i].correct) score++;
  }
  pageState[currentPage] = { submitted: true, score };
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderPageScoreBanner() {
  const state = pageState[currentPage];
  if (!state.submitted) {
    els.pageScoreBanner.classList.add('hidden');
    els.pageScoreBanner.innerHTML = '';
    return;
  }
  const { start, end } = pageRange(currentPage);
  const total = end - start;
  const pct = Math.round((state.score / total) * 100);
  const tone = pct >= 70 ? 'moss' : pct >= 40 ? 'amber' : 'brick';
  const toneClasses = {
    moss:  'border-moss-500 bg-moss-50 text-moss-600',
    amber: 'border-amber-600 bg-amber-100 text-amber-700',
    brick: 'border-brick-500 bg-brick-50 text-brick-600'
  };
  els.pageScoreBanner.className = `px-5 py-4 mb-6 border-l-4 rounded-r-md ${toneClasses[tone]}`;
  els.pageScoreBanner.innerHTML = `
    <p class="font-serif text-lg font-semibold">This page: ${state.score} / ${total} correct (${pct}%)</p>
    <p class="text-sm mt-1 opacity-80">Correct answers are green, your incorrect picks are red. Other pages are unaffected.</p>
  `;
  els.pageScoreBanner.classList.remove('hidden');
}

function updateOverallSummary() {
  const checkedPages = pageState.filter(p => p.submitted).length;
  if (checkedPages === 0) {
    els.overallSummary.textContent = `${QUESTIONS.length} questions across ${TOTAL_PAGES} pages — check each page whenever you're ready.`;
    return;
  }
  const totalCorrect = pageState.reduce((sum, p) => sum + (p.submitted ? p.score : 0), 0);
  const totalChecked = pageState.reduce((sum, p, i) => {
    if (!p.submitted) return sum;
    const { start, end } = pageRange(i);
    return sum + (end - start);
  }, 0);
  els.overallSummary.textContent = `Checked ${checkedPages} of ${TOTAL_PAGES} pages · Overall so far: ${totalCorrect} / ${totalChecked} correct`;
}

els.prevBtn.addEventListener('click', () => {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
});

els.nextBtn.addEventListener('click', () => {
  if (currentPage < TOTAL_PAGES - 1) {
    currentPage++;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
});

renderPage();
</script>
</body>
</html>
